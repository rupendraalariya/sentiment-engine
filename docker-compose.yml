services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentiment-engine:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    env_file:
      - .env
    environment:
      MODEL_DIR: /app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sentiment-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentiment-engine:latest
    command: ["python", "app.py"]
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
